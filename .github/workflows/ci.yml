name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Скрипты, тесты без 1С, сборка
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/ci-tui/go.mod
          cache: false

      - name: go vet и go test
        shell: pwsh
        run: |
          foreach ($m in 'ci-tui', 'fake1c', 'build', 'merge1c') {
            Push-Location "src/$m"
            go vet ./...
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            go test ./...
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Pop-Location
          }

      - name: Разбор скриптов PowerShell 5.1 (check.ps1)
        shell: powershell
        run: |
          & ./gate/check.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Подставная 1С
        shell: pwsh
        working-directory: src/fake1c
        run: go build -o ../../gate/test/fake1c.exe .

      - name: Объединение поставок (merge1c)
        shell: pwsh
        working-directory: src/merge1c
        run: go build -o ../../gate/test/merge1c.exe .

      - name: Тесты гейта без 1С (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & ./gate/test/tests.ps1 -TimeoutSec 600
          exit $LASTEXITCODE

      - name: Отчёт тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-last-run
          path: gate/test/last-run.txt
          if-no-files-found: ignore

      - name: Сборка
        shell: pwsh
        run: |
          $stamp = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $stamp = $env:GITHUB_REF_NAME.TrimStart('v') }
          Push-Location src/build
          if ($stamp) { go run . -root ../.. -out dist -stamp $stamp } else { go run . -root ../.. -out dist }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Remove-Item dist/*.exe

      - name: Приёмка из установленного ZIP без системного Python
        shell: powershell
        run: |
          $bundle = @(Get-ChildItem dist/ci-gate_*.zip -File)
          if ($bundle.Count -ne 1) { throw 'ожидается один комплект гейта' }
          & ./gate/test/portable-python.ps1 -Bundle $bundle[0].FullName

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.zip
          if-no-files-found: error

  bsl:
    name: BSL Language Server
    runs-on: ubuntu-latest
    # Блокирующая: ошибки (severity Error) валят сборку. Намеренные места подавлены в коде комментарием
    # BSLLS:<Диагностика>-off с пояснением рядом, отключённые целиком - в .bsl-language-server.json.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/build/go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Собрать исходники обработки с пакетами
        working-directory: src/build
        run: go run . -root ../.. -check -src-out ../../bsl-src
      - name: Анализ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo 1c-syntax/bsl-language-server --pattern '*-exec.jar' --output bsl-ls.jar
          set -o pipefail
          # Отчёт json BSL LS пишет в готовую папку: сам он её не создаёт.
          mkdir -p bsl-report
          java -jar bsl-ls.jar --analyze --srcDir bsl-src --configuration .bsl-language-server.json --outputDir bsl-report --reporter console --reporter json | tee bsl-console.txt
      - name: Ошибки BSL LS
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open('bsl-report/bsl-json.json', encoding='utf-8'))
          errors = []
          for info in data.get('fileinfos', []):
              for diag in info.get('diagnostics', []):
                  if diag.get('severity') == 'Error':
                      errors.append('%s:%d %s %s' % (info['path'], diag['range']['start']['line'] + 1, diag['code'], diag['message']))
          print('ошибок BSL LS: %d' % len(errors))
          for line in errors:
              print('  ' + line)
          sys.exit(1 if errors else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bsl-report
          path: |
            bsl-report
            bsl-console.txt
          if-no-files-found: ignore

  release:
    name: Публикация проверенной сборки
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [gate, bsl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "Сборка $GITHUB_REF_NAME. Установка: распаковать ci-gate_*.zip и запустить install.cmd."
